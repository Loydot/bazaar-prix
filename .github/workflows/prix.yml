# Releve des prix, a heures fixes.
#
# La tache tourne chez GitHub, pas sur le PC des joueurs : une seule machine
# interroge warframe.market, tout le monde telecharge le fichier produit.
#
# Cadence : toutes les 6 heures. Un passage complet dure une trentaine de
# minutes — la cadence est volontairement tenue sous 3 requetes/seconde, et un
# runner GitHub partage son adresse avec d'autres, donc il encaisse des
# ralentissements que la meme collecte n'aurait pas sur une machine de bureau.
# Inutile d'aller plus vite : les prix medians sur 48 h ne bougent pas d'une
# heure a l'autre.
#
# Le fichier atterrit dans docs/, servi par GitHub Pages. C'est "docs" et non
# "public" parce que Pages ne sait servir que la racine ou ce dossier-la.
name: prix

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:        # bouton manuel dans l'onglet Actions

permissions:
  contents: write

# Un relevé a la fois. Deux passages simultanes se marcheraient dessus au
# moment du commit, et doubleraient la charge sur warframe.market.
concurrency:
  group: prix
  cancel-in-progress: false

jobs:
  relever:
    runs-on: ubuntu-latest
    # Large : mieux vaut un relevé lent qu'un relevé coupe en plein vol, qui
    # laisserait les prix publies vieillir jusqu'au passage suivant.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Relever les prix
        run: python collecteur.py --sortie docs/prix.json

      # Un releve rate peut rendre un fichier presque vide sans echouer :
      # l'API repond, mais ne renvoie rien d'exploitable. Publier ca
      # remplacerait des prix corrects par du vide chez tous les joueurs.
      - name: Verifier le releve avant de publier
        run: |
          python - <<'PY'
          import json, sys
          d = json.load(open("docs/prix.json", encoding="utf-8"))
          n = len(d.get("prix", {}))
          print(f"{n} objets releves")
          if n < 2000:
              sys.exit(f"releve trop maigre ({n} objets) : on ne publie pas")
          PY

      # Le releve dure une demi-heure. Pendant ce temps, la branche a pu
      # bouger — un correctif pousse a la main, un autre outil. Le push est
      # alors refuse ("fetch first") et tout le relevé part a la poubelle.
      # On rejoue donc notre commit par-dessus ce qui est arrive entre-temps.
      # Notre commit ne touche qu'un fichier que personne d'autre n'ecrit :
      # le rebase ne peut pas entrer en conflit.
      - name: Publier si le fichier a change
        run: |
          git config user.name  "collecteur"
          git config user.email "actions@github.com"
          git add docs/prix.json
          if git diff --staged --quiet; then
            echo "prix inchanges, rien a publier"
            exit 0
          fi
          git commit -m "prix $(date -u +%F\ %H:%M)"
          for essai in 1 2 3; do
            if git push; then
              echo "publie (tentative $essai)"
              exit 0
            fi
            echo "push refuse, la branche a bouge — on se replace dessus"
            git pull --rebase --autostash origin main
          done
          echo "publication impossible apres 3 tentatives"
          exit 1
