# Releve des prix toutes les 6 heures.
#
# Ca tourne chez GitHub et pas sur le PC des joueurs, comme ca une seule
# machine interroge warframe.market.
#
# Un passage complet prend une trentaine de minutes. C'est normal, le
# collecteur se tient sous 3 requetes par seconde. Inutile d'aller plus vite,
# des prix medians calcules sur 48 h ne bougent pas d'une heure a l'autre.
#
# Le fichier va dans docs/ parce que GitHub Pages ne sait servir que la
# racine du depot ou ce dossier-la, pas un autre.
name: prix

on:
  schedule:
    # 23 et pas 0. GitHub retarde les taches planifiees quand ses machines
    # sont chargees, et le haut de l'heure est le pire moment. C'est leur
    # doc qui conseille de decaler. Vu le 26/08/2026 : passage demande a
    # 06:00 UTC, demarre a 08:09.
    - cron: "23 */6 * * *"
  workflow_dispatch:        # bouton manuel dans l'onglet Actions

permissions:
  contents: write

# Un seul releve a la fois. Deux en parallele se marcheraient dessus au
# moment du commit et taperaient deux fois sur l'API.
concurrency:
  group: prix
  cancel-in-progress: false

jobs:
  relever:
    runs-on: ubuntu-latest
    # Large expres. Un releve lent vaut mieux qu'un releve coupe en route,
    # qui laisserait les prix vieillir jusqu'au passage suivant.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Relever les prix
        run: python collecteur.py --sortie docs/prix.json

      # Un releve peut rater sans planter : l'API repond mais ne renvoie rien
      # d'utilisable, et on se retrouve avec un fichier quasi vide. Si on le
      # publiait, tous les joueurs perdraient des prix corrects.
      - name: Verifier le releve avant de publier
        run: |
          python - <<'PY'
          import json, sys
          d = json.load(open("docs/prix.json", encoding="utf-8"))
          n = len(d.get("prix", {}))
          print(f"{n} objets releves")
          if n < 2000:
              sys.exit(f"releve trop maigre ({n} objets) : on ne publie pas")
          PY

      # Le releve dure une demi-heure, et pendant ce temps la branche a pu
      # bouger (un correctif pousse a la main, par exemple). Le push se fait
      # alors refuser avec "fetch first" et la demi-heure part a la poubelle.
      # On rejoue donc le commit par-dessus ce qui est arrive entre-temps.
      # Aucun risque de conflit, personne d'autre n'ecrit dans ce fichier.
      - name: Publier si le fichier a change
        run: |
          git config user.name  "collecteur"
          git config user.email "actions@github.com"
          git add docs/prix.json
          if git diff --staged --quiet; then
            echo "prix inchanges, rien a publier"
            exit 0
          fi
          git commit -m "prix $(date -u +%F\ %H:%M)"
          for essai in 1 2 3; do
            if git push; then
              echo "publie (tentative $essai)"
              exit 0
            fi
            echo "push refuse, la branche a bouge, on se replace dessus"
            git pull --rebase --autostash origin main
          done
          echo "publication impossible apres 3 tentatives"
          exit 1
